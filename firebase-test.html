<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
</head>
<body>
    <h1>Firebase Connection Test</h1>
    <div id="status">Initializing...</div>
    <div id="current-count">Current count: Loading...</div>
    <button id="increment-btn">Increment Views Manually</button>
    <div id="error-log"></div>

    <script type="module">
        // Firebase configuration and initialization
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDThKWhYAIpLkcNzEAjJvdexFDk2Zvjd7Q",
            authDomain: "portfolio-501510.firebaseapp.com",
            projectId: "portfolio-501510",
            storageBucket: "portfolio-501510.firebasestorage.app",
            messagingSenderId: "311452264939",
            appId: "1:311452264939:web:cecf93a47a108c363ad1ae",
            measurementId: "G-E183T20M2S"
        };

        // Initialize Firebase
        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            document.getElementById('status').textContent = 'Firebase initialized successfully!';
            console.log('Firebase initialized successfully');
        } catch (error) {
            document.getElementById('status').textContent = 'Firebase initialization failed: ' + error.message;
            console.error('Firebase initialization error:', error);
        }

        // Function to get current view count
        async function getCurrentViewCount() {
            try {
                const viewsRef = doc(db, 'portfolio', 'views');
                const viewsSnap = await getDoc(viewsRef);
                
                if (viewsSnap.exists()) {
                    const count = viewsSnap.data().count;
                    document.getElementById('current-count').textContent = `Current count: ${count}`;
                    console.log('Current view count:', count);
                    return count;
                } else {
                    document.getElementById('current-count').textContent = 'Current count: Document does not exist';
                    console.log('Views document does not exist');
                    return 0;
                }
            } catch (error) {
                const errorMsg = 'Error getting views: ' + error.message;
                document.getElementById('current-count').textContent = errorMsg;
                document.getElementById('error-log').innerHTML += '<p>' + errorMsg + '</p>';
                console.error('Error getting views:', error);
                return 0;
            }
        }

        // Function to increment portfolio views
        async function incrementPortfolioViews() {
            try {
                const viewsRef = doc(db, 'portfolio', 'views');
                
                // Check if document exists, if not create it
                const viewsSnap = await getDoc(viewsRef);
                
                if (!viewsSnap.exists()) {
                    console.log('Creating new views document...');
                    await setDoc(viewsRef, { count: 1 });
                    document.getElementById('current-count').textContent = 'Current count: 1 (new document created)';
                    console.log('New document created with count: 1');
                } else {
                    console.log('Incrementing existing document...');
                    await updateDoc(viewsRef, {
                        count: increment(1)
                    });
                    
                    // Get the updated count
                    const updatedSnap = await getDoc(viewsRef);
                    const newCount = updatedSnap.data().count;
                    document.getElementById('current-count').textContent = `Current count: ${newCount}`;
                    console.log('Document updated, new count:', newCount);
                }
            } catch (error) {
                const errorMsg = 'Error updating views: ' + error.message;
                document.getElementById('error-log').innerHTML += '<p style="color: red;">' + errorMsg + '</p>';
                console.error('Error updating views:', error);
            }
        }

        // Test on page load
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Page loaded, testing Firebase...');
            await getCurrentViewCount();
        });

        // Manual increment button
        document.getElementById('increment-btn').addEventListener('click', async function() {
            console.log('Manual increment button clicked...');
            await incrementPortfolioViews();
            // Refresh the count display
            setTimeout(() => getCurrentViewCount(), 1000);
        });
    </script>
</body>
</html>
