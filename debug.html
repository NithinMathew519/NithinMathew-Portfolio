<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Firebase Issues</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f5f5f5; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
        }
        .log { 
            padding: 8px 12px; 
            margin: 3px 0; 
            border-radius: 4px; 
            font-size: 14px; 
        }
        .success { 
            background: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
        }
        .error { 
            background: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
        }
        .info { 
            background: #d1ecf1; 
            color: #0c5460; 
            border: 1px solid #bee5eb; 
        }
        .warning { 
            background: #fff3cd; 
            color: #856404; 
            border: 1px solid #ffeaa7; 
        }
        .console { 
            background: #2d3748; 
            color: #e2e8f0; 
            padding: 15px; 
            border-radius: 8px; 
            height: 400px; 
            overflow-y: auto; 
            font-family: monospace; 
            font-size: 13px; 
        }
        button { 
            padding: 8px 16px; 
            margin: 5px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .btn-primary { 
            background: #007bff; 
            color: white; 
        }
        .btn-success { 
            background: #28a745; 
            color: white; 
        }
        .btn-danger { 
            background: #dc3545; 
            color: white; 
        }
        .btn-warning { 
            background: #ffc107; 
            color: #212529; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Firebase Debug Tool</h1>
        
        <div style="margin-bottom: 20px;">
            <button class="btn-primary" onclick="testFirebaseConnection()">Test Firebase Connection</button>
            <button class="btn-success" onclick="testVisitorTracking()">Test Visitor Tracking</button>
            <button class="btn-warning" onclick="testViewsUpdate()">Test Views Update</button>
            <button class="btn-danger" onclick="clearLogs()">Clear Logs</button>
        </div>
        <div class="console" id="console"></div>
        
        <div style="margin-top: 20px;">
            <a href="index.html" style="padding: 8px 16px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px;">← Back to Portfolio</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, addDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDThKWhYAIpLkcNzEAjJvdexFDk2Zvjd7Q",
            authDomain: "portfolio-501510.firebaseapp.com",
            projectId: "portfolio-501510",
            storageBucket: "portfolio-501510.firebasestorage.app",
            messagingSenderId: "311452264939",
            appId: "1:311452264939:web:cecf93a47a108c363ad1ae",
            measurementId: "G-E183T20M2S"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: '#60a5fa',
                success: '#34d399',
                error: '#f87171',
                warning: '#fbbf24'
            };
            
            console.innerHTML += `<div style="color: ${colors[type]}; margin-bottom: 3px;">[${timestamp}] ${message}</div>`;
            console.scrollTop = console.scrollHeight;
        }
        
        // Test Firebase connection
        window.testFirebaseConnection = async function() {
            try {
                log('🔥 Testing Firebase connection...', 'info');
                
                // Test basic connection
                const testRef = doc(db, 'test', 'connection');
                await setDoc(testRef, { test: true, timestamp: new Date() });
                log('✅ Firebase connection working!', 'success');
                
                // Test read access
                const testDoc = await getDoc(testRef);
                if (testDoc.exists()) {
                    log('✅ Firebase read access working!', 'success');
                } else {
                    log('❌ Firebase read access failed!', 'error');
                }
                
            } catch (error) {
                log(`❌ Firebase connection failed: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
            }
        };
        
        // Test visitor tracking
        window.testVisitorTracking = async function() {
            try {
                log('👤 Testing visitor tracking...', 'info');
                
                // Get location first
                log('📡 Getting location...', 'info');
                const response = await fetch('https://ipapi.co/json/');
                const locationData = await response.json();
                
                if (locationData.latitude && locationData.longitude) {
                    log(`📍 Location: ${locationData.city}, ${locationData.country_name}`, 'success');
                    
                    const visitorData = {
                        timestamp: new Date(),
                        userAgent: navigator.userAgent,
                        referrer: document.referrer || 'direct',
                        language: navigator.language,
                        screen: {
                            width: screen.width,
                            height: screen.height
                        },
                        viewport: {
                            width: window.innerWidth,
                            height: window.innerHeight
                        },
                        location: {
                            latitude: locationData.latitude,
                            longitude: locationData.longitude,
                            city: locationData.city,
                            region: locationData.region,
                            country: locationData.country_name,
                            countryCode: locationData.country_code,
                            ip: locationData.ip,
                            method: 'ip_geolocation'
                        }
                    };
                    
                    log('💾 Saving visitor to Firebase...', 'info');
                    const visitorsRef = collection(db, 'portfolio', 'analytics', 'visitors');
                    const docRef = await addDoc(visitorsRef, visitorData);
                    
                    log(`✅ Visitor saved! ID: ${docRef.id}`, 'success');
                    
                    // Count total visitors
                    const snapshot = await getDocs(visitorsRef);
                    log(`📊 Total visitors: ${snapshot.size}`, 'info');
                    
                } else {
                    log('❌ Could not get location data', 'error');
                }
                
            } catch (error) {
                log(`❌ Visitor tracking failed: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
            }
        };

        // Test views update
        window.testViewsUpdate = async function() {
            try {
                log('📊 Testing views update...', 'info');
                
                const viewsRef = doc(db, 'portfolio', 'views');
                
                // Check if views document exists
                const viewsSnap = await getDoc(viewsRef);
                
                if (!viewsSnap.exists()) {
                    log('📝 Views document does not exist, creating...', 'info');
                    await setDoc(viewsRef, { count: 1 });
                    log('✅ Views document created with count: 1', 'success');
                } else {
                    log('📈 Views document exists, incrementing...', 'info');
                    await updateDoc(viewsRef, {
                        count: increment(1)
                    });
                    
                    // Get updated count
                    const updatedSnap = await getDoc(viewsRef);
                    const newCount = updatedSnap.data().count;
                    log(`✅ Views incremented! New count: ${newCount}`, 'success');
                }
                
            } catch (error) {
                log(`❌ Views update failed: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
            }
        };

        window.clearLogs = function() {
            document.getElementById('console').innerHTML = '';
            log('🧹 Console cleared', 'info');
        };

        // Initialize
        log('🚀 Firebase Debug Tool loaded', 'success');
        log('📁 Testing paths: portfolio/analytics/visitors & portfolio/views', 'info');
    </script>
</body>
</html>
