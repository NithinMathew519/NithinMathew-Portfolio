<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Analytics - Original Structure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4><i class="bi bi-graph-up"></i> Visitor Analytics Dashboard</h4>
                        <div>
                            <a href="index.html" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-house"></i> Portfolio
                            </a>
                            <button class="btn btn-sm btn-success" onclick="refreshData()">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Statistics -->
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <h2 id="totalVisitors">0</h2>
                                        <p>Total Visitors</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <h2 id="totalCountries">0</h2>
                                        <p>Countries</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-info text-white">
                                    <div class="card-body text-center">
                                        <h2 id="totalCities">0</h2>
                                        <p>Cities</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-warning text-white">
                                    <div class="card-body text-center">
                                        <h2 id="todayVisitors">0</h2>
                                        <p>Today</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Visitor List -->
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="bi bi-people"></i> Recent Visitors</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th>Date & Time</th>
                                                <th>Location</th>
                                                <th>Country</th>
                                                <th>Method</th>
                                                <th>Browser</th>
                                            </tr>
                                        </thead>
                                        <tbody id="visitorsTable">
                                            <tr>
                                                <td colspan="5" class="text-center text-muted">Loading visitors...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="mt-3">
                            <div id="status" class="alert alert-info">
                                <i class="bi bi-info-circle"></i> Loading visitor data from portfolio/analytics/visitors...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDThKWhYAIpLkcNzEAjJvdexFDk2Zvjd7Q",
            authDomain: "portfolio-501510.firebaseapp.com",
            projectId: "portfolio-501510",
            storageBucket: "portfolio-501510.firebasestorage.app",
            messagingSenderId: "311452264939",
            appId: "1:311452264939:web:cecf93a47a108c363ad1ae",
            measurementId: "G-E183T20M2S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let visitorData = [];

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            const icons = {
                'info': 'bi-info-circle',
                'success': 'bi-check-circle',
                'error': 'bi-exclamation-triangle'
            };
            status.className = `alert alert-${type}`;
            status.innerHTML = `<i class="bi ${icons[type]}"></i> ${message}`;
        }

        async function loadVisitorData() {
            try {
                updateStatus('Loading visitor data from portfolio/analytics/visitors...', 'info');
                
                // Use the original nested path as shown in Firebase console
                const visitorsRef = collection(db, 'portfolio', 'analytics', 'visitors');
                const snapshot = await getDocs(visitorsRef);
                
                visitorData = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    visitorData.push({
                        id: doc.id,
                        ...data,
                        timestamp: data.timestamp?.toDate?.() || new Date()
                    });
                });

                // Sort by timestamp (newest first)
                visitorData.sort((a, b) => b.timestamp - a.timestamp);
                
                updateAnalytics();
                updateStatus(`Successfully loaded ${visitorData.length} visitor records`, 'success');
                
            } catch (error) {
                updateStatus(`Error loading data: ${error.message}`, 'error');
                console.error('Error loading visitor data:', error);
            }
        }

        function updateAnalytics() {
            // Update statistics
            const totalVisitors = visitorData.length;
            
            // Extract countries from location data (handling both structures)
            const countries = [...new Set(visitorData.map(v => {
                if (v.location && v.location.country) return v.location.country;
                if (v.country) return v.country;
                return null;
            }).filter(Boolean))];
            
            // Extract cities from location data
            const cities = [...new Set(visitorData.map(v => {
                if (v.location && v.location.city) return v.location.city;
                if (v.city) return v.city;
                return null;
            }).filter(Boolean))];
            
            // Today's visitors
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayVisitors = visitorData.filter(v => {
                const visitDate = new Date(v.timestamp);
                visitDate.setHours(0, 0, 0, 0);
                return visitDate.getTime() === today.getTime();
            }).length;

            document.getElementById('totalVisitors').textContent = totalVisitors;
            document.getElementById('totalCountries').textContent = countries.length;
            document.getElementById('totalCities').textContent = cities.length;
            document.getElementById('todayVisitors').textContent = todayVisitors;

            // Update visitor table
            const tbody = document.getElementById('visitorsTable');
            
            if (visitorData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No visitors found</td></tr>';
                return;
            }

            tbody.innerHTML = visitorData.map(visitor => {
                // Handle both location structures
                let locationInfo = 'Unknown';
                let country = 'Unknown';
                let method = 'Unknown';
                
                if (visitor.location) {
                    locationInfo = `${visitor.location.city || 'Unknown'}, ${visitor.location.region || ''}`;
                    country = visitor.location.country || 'Unknown';
                    method = visitor.location.method || 'Unknown';
                } else {
                    locationInfo = `${visitor.city || 'Unknown'}, ${visitor.region || ''}`;
                    country = visitor.country || 'Unknown';
                }

                const userAgent = (visitor.userAgent || 'Unknown').substring(0, 50) + '...';
                
                return `
                    <tr>
                        <td>${visitor.timestamp.toLocaleString()}</td>
                        <td>${locationInfo}</td>
                        <td>${country}</td>
                        <td><span class="badge bg-info">${method}</span></td>
                        <td><small>${userAgent}</small></td>
                    </tr>
                `;
            }).join('');
        }

        window.refreshData = function() {
            loadVisitorData();
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadVisitorData();
        });
    </script>
</body>
</html>
